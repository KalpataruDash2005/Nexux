server:
  port: 8081
spring:
  application:
    name: rag-service
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

app:
  qdrant:
    host: ${QDRANT_HOST:127.0.0.1}
    port: ${QDRANT_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    use-tls: ${QDRANT_USE_TLS:false}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:phi3:mini}
  rag:
    min-score: ${RAG_MIN_SCORE:0.7}


llm:
  provider: ${LLM_PROVIDER:groq}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama3-8b-8192}

