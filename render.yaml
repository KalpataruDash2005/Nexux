# render.yaml – Deploy the CareerOS backend on Render via Docker.
# This file is used by Render to build your Dockerfile.
# All environment variables must be set in the Render dashboard
# (Project Settings → Environment). Do NOT commit secret values.

services:
  - type: web
    name: careeros-backend
    env: docker
    autoDeploy: true
    source: backend

    # Environment variables are entered manually in the Render dashboard.
    # See the list of required vars in the deployment guide.
    # If you wish, you can keep this section as a reminder, but leave
    # the values empty or delete the env: block entirely; Render will
    # prompt you to add them after the service is created.

ports:
  - port: 8080
    internalPort: 8080