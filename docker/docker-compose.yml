version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-careeros_db}
      POSTGRES_USER: ${DB_USER:-careeros_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - careeros-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: careeros-n8n
    restart: always
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_EMBEDDING_BASE_URL=${N8N_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - N8N_EMBEDDING_API_KEY=${OPENAI_API_KEY}
      - N8N_EMBEDDING_MODEL=${N8N_EMBEDDING_MODEL:-text-embedding-3-small}
      - N8N_LLM_BASE_URL=${N8N_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - N8N_LLM_API_KEY=${OPENAI_API_KEY}
      - N8N_LLM_MODEL=${N8N_LLM_MODEL:-llama-3.1-8b-instant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8081}
      - PDF_ASSISTANT_INTERNAL_KEY=${PDF_ASSISTANT_INTERNAL_KEY:-careeros-pdf-internal}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: careeros-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - careeros-qdrant-data:/qdrant/storage

volumes:
  careeros-postgres-data:
    driver: local
  n8n-data:
    driver: local
  careeros-qdrant-data:
    driver: local