spring:
  config:
    import: optional:file:.env
  profiles:
    active: dev
  application:
    name: careeros-backend
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
app:
  oauth:
    cookie-secret: ${OAUTH_COOKIE_SECRET:nexora-dev-cookie-secret-change-me}
    cookie-secure: ${OAUTH_COOKIE_SECURE:false}
