spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration-pg
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  oauth:
    cookie-secret: ${OAUTH_COOKIE_SECRET}
    cookie-secure: true
  frontend-url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  qdrant:
    host: ${QDRANT_HOST}
    port: ${QDRANT_PORT:6334}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
    model: ${OPENAI_MODEL:openai/gpt-oss-120b}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:noreply@careeros.com}
    api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  pdf-assistant:
    n8n-enabled: ${PDF_ASSISTANT_N8N_ENABLED:false}
    n8n-webhook-url: ${N8N_WEBHOOK_URL}
    n8n-api-key: ${N8N_API_KEY:}
    internal-key: ${PDF_ASSISTANT_INTERNAL_KEY}
    storage-dir: ${PDF_ASSISTANT_STORAGE_DIR:/var/data/pdf-assistant}
    qdrant-host: ${QDRANT_HOST}
    qdrant-api-key: ${QDRANT_API_KEY}
    qdrant-port: ${QDRANT_PORT:6334}
    qdrant-rest-port: ${QDRANT_REST_PORT:6333}
    qdrant-collection: careeros_pdf_chunks
    embedding-dimension: 384
    chunk-size: 600
    chunk-overlap: 100
    top-k: 5
    min-score: 0.30

careeros:
  admin:
    email: ${CAREEROS_ADMIN_EMAIL:admin@nexora.app}
    password: ${CAREEROS_ADMIN_PASSWORD}
