version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    restart: always
    environment:
      POSTGRES_DB: careeros_db
      POSTGRES_USER: careeros_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careeros_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - careeros-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros_user -d careeros_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: careeros-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - careeros-qdrant-data:/qdrant/storage

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: careeros-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - n8n-data:/home/node/.n8n

  backend:
    build: 
      context: ./backend
    container_name: careeros-backend
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - QDRANT_HOST=qdrant
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: careeros-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  careeros-postgres-data:
    driver: local
  careeros-qdrant-data:
    driver: local
  n8n-data:
    driver: local
