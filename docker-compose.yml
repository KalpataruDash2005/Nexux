name: nexaura-deployment

services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: nexaura-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-careeros_db}
      MYSQL_USER: ${MYSQL_USER:-careeros_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-careeros_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-careeros_root_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-careeros_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexaura_network

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: nexaura-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - nexaura_network

  # 3. FastAPI Backend
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexaura-backend
    restart: unless-stopped
    environment:
      # Database connection using Compose service name 'mysql' and internal port 3306
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-careeros_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-careeros_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-careeros_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}

      # Qdrant connection using Compose service name 'qdrant' and internal port 6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-careeros_pdf_chunks}
      QDRANT_USE_TLS: "false"
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}

      # Authentication & Security
      JWT_SECRET: ${JWT_SECRET:-careeros-super-secret-jwt-key-with-at-least-256-bits-length-for-security-purposes!}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # Admin Seeding
      CAREEROS_ADMIN_EMAIL: ${CAREEROS_ADMIN_EMAIL:-admin@nexora.app}
      CAREEROS_ADMIN_PASSWORD: ${CAREEROS_ADMIN_PASSWORD:-Admin@12345}

      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:80,http://127.0.0.1:80,http://localhost:5173"

      # xAI Grok Model Routing Settings
      XAI_API_BASE_URL: ${XAI_API_BASE_URL:-https://api.x.ai/v1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_API_KEY_PDF: ${XAI_API_KEY_PDF:-}
      XAI_API_KEY_CHAT: ${XAI_API_KEY_CHAT:-}
      XAI_API_KEY_RESUME: ${XAI_API_KEY_RESUME:-}
      XAI_API_KEY_ASSESSMENT: ${XAI_API_KEY_ASSESSMENT:-}
      XAI_API_KEY_GENERAL: ${XAI_API_KEY_GENERAL:-}
      XAI_BACKUP_API_KEY: ${XAI_BACKUP_API_KEY:-}
      XAI_BACKUP_API_KEY_PDF: ${XAI_BACKUP_API_KEY_PDF:-}
      XAI_BACKUP_API_KEY_CHAT: ${XAI_BACKUP_API_KEY_CHAT:-}
      XAI_BACKUP_API_KEY_RESUME: ${XAI_BACKUP_API_KEY_RESUME:-}
      XAI_BACKUP_API_KEY_ASSESSMENT: ${XAI_BACKUP_API_KEY_ASSESSMENT:-}
      XAI_BACKUP_API_KEY_GENERAL: ${XAI_BACKUP_API_KEY_GENERAL:-}
      XAI_DEFAULT_MODEL: ${XAI_DEFAULT_MODEL:-grok-2-mini}
      XAI_MODEL_PDF: ${XAI_MODEL_PDF:-grok-2-1212}
      XAI_MODEL_CHAT: ${XAI_MODEL_CHAT:-grok-2-mini}
      XAI_MODEL_RESUME: ${XAI_MODEL_RESUME:-grok-2-1212}
      XAI_MODEL_ASSESSMENT: ${XAI_MODEL_ASSESSMENT:-grok-2-1212}
      XAI_MODEL_GENERAL: ${XAI_MODEL_GENERAL:-grok-2-mini}
      XAI_FALLBACK_MODEL: ${XAI_FALLBACK_MODEL:-grok-beta}
      XAI_MAX_RETRIES: ${XAI_MAX_RETRIES:-2}
      XAI_TIMEOUT_SECONDS: ${XAI_TIMEOUT_SECONDS:-30.0}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexaura_network

  # 4. React 18 + Vite Frontend (Served through Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: nexaura-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexaura_network

volumes:
  mysql_data:
    name: nexaura-deployment_mysql_data
    driver: local
  qdrant_data:
    name: nexaura-deployment_qdrant_data
    driver: local
  backend_uploads:
    name: nexaura-deployment_backend_uploads
    driver: local

networks:
  nexaura_network:
    name: nexaura_network
    driver: bridge
